<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of /tuna-repo</title>
    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        
        h1 {
            font-size: 1.5em;
            border-bottom: 1px solid #cccccc;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s;
        }

        .theme-toggle {
            font-size: 0.6em;
            cursor: pointer;
            color: #0000ee;
            background: none;
            border: none;
            font-family: monospace;
            font-weight: normal;
        }
        .theme-toggle:hover {
            text-decoration: underline;
        }

        .search-container {
            margin-bottom: 20px;
        }
        #searchInput {
            font-family: monospace;
            padding: 6px;
            width: 300px;
            border: 1px solid #888;
            background-color: #f9f9f9;
            color: #000;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        #searchInput:focus {
            outline: none;
            border-color: #000;
            background-color: #fff;
        }

        table {
            width: 100%;
            max-width: 1000px;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #eeeeee;
            transition: border-color 0.3s;
        }
        th {
            font-weight: bold;
        }
        a {
            text-decoration: none;
            color: #0000ee;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        .icon {
            margin-right: 8px;
        }
        .footer {
            margin-top: 30px;
            font-style: italic;
            color: #666;
            border-top: 1px solid #cccccc;
            padding-top: 10px;
            transition: border-color 0.3s;
        }

        /* --- DARK MODE STYLES --- */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode h1,
        body.dark-mode th,
        body.dark-mode td,
        body.dark-mode .footer {
            border-color: #333333;
        }
        body.dark-mode a,
        body.dark-mode .theme-toggle {
            color: #66b3ff;
        }
        body.dark-mode #searchInput {
            background-color: #1e1e1e;
            border-color: #444;
            color: #e0e0e0;
        }
        body.dark-mode #searchInput:focus {
            border-color: #66b3ff;
            background-color: #2a2a2a;
        }
    </style>
</head>
<body>

    <h1 id="header-title">
        <span id="path-text">Index of /tuna-repo/</span>
        <button class="theme-toggle" onclick="toggleDarkMode()">[Toggle Dark Mode]</button>
    </h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Global search (files, tags, games)..." onkeyup="renderTable()">
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Game</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="repo-table">
            <tr><td colspan="4">Loading mods from server...</td></tr>
        </tbody>
    </table>

    <div class="footer">
        Tuna Ultimate Repository Server/1.0
    </div>

<script>
        // --- DARK MODE ---
        if (localStorage.getItem('tuna-dark-mode') === 'true') {
            document.body.classList.add('dark-mode');
        }
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('tuna-dark-mode', document.body.classList.contains('dark-mode'));
        }

        // --- LÓGICA DE DADOS E DIRETÓRIOS ---
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSazDiNXrq7jCsWueek9taIzGek6NewRMkwxw6nJx_rAlfTsbBca6Sr-Gb7BxaeOESpor3chXzWEjOT/pub?output=csv';
        
        let allMods = []; 
        let currentFolder = ''; 

        async function fetchMods() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n');
                
                allMods = []; 

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row.trim()) continue; 

                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length >= 4) {
                        // O .trim() aqui resolve o bug das quebras de linha invisíveis
                        allMods.push({
                            nome: cols[0].replace(/"/g, '').trim(),
                            link: cols[1].replace(/"/g, '').trim(),
                            categoria: cols[2].replace(/"/g, '').trim(),
                            jogo: cols[3].replace(/"/g, '').trim()
                        });
                    }
                }
                renderTable(); 
            } catch (error) {
                document.getElementById('repo-table').innerHTML = '<tr><td colspan="4">Erro ao carregar o repositório.</td></tr>';
                console.error(error);
            }
        }

        function openFolder(folderName) {
            currentFolder = folderName;
            document.getElementById('searchInput').value = ''; 
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('repo-table');
            const pathText = document.getElementById('path-text');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            tableBody.innerHTML = '';

            // MODO 1: BUSCA GLOBAL
            if (searchTerm !== '') {
                pathText.innerText = `Index of /tuna-repo/search...`;
                
                const resultados = allMods.filter(mod => {
                    const textoLinha = `${mod.nome} ${mod.categoria} ${mod.jogo}`.toLowerCase();
                    return textoLinha.includes(searchTerm);
                });

                if (resultados.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4">No results found for "${searchTerm}"</td></tr>`;
                    return;
                }

                resultados.forEach(mod => {
                    tableBody.innerHTML += `
                        <tr>
                            <td><span class="icon">📄</span> <a href="${mod.link}" target="_blank">${mod.nome}</a></td>
                            <td>${mod.categoria}</td>
                            <td>${mod.jogo}</td>
                            <td><a href="${mod.link}" target="_blank">[Download]</a></td>
                        </tr>
                    `;
                });
                return; 
            }

            // MODO 2: PASTA RAIZ (Mostra os Jogos)
            if (currentFolder === '') {
                pathText.innerText = `Index of /tuna-repo/`;
                
                const games = [...new Set(allMods.map(m => m.jogo))];
                
                games.forEach(game => {
                    tableBody.innerHTML += `
                        <tr>
                            <td><span class="icon">📁</span> <a onclick="openFolder('${game}')">${game}/</a></td>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                        </tr>
                    `;
                });
            } 
            // MODO 3: DENTRO DO JOGO
            else {
                pathText.innerText = `Index of /tuna-repo/${currentFolder}/`;
                
                tableBody.innerHTML += `
                    <tr>
                        <td><span class="icon">📁</span> <a onclick="openFolder('')">../</a></td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>
                `;

                const modsDoJogo = allMods.filter(mod => mod.jogo === currentFolder);
                
                modsDoJogo.forEach(mod => {
                    tableBody.innerHTML += `
                        <tr>
                            <td><span class="icon">📄</span> <a href="${mod.link}" target="_blank">${mod.nome}</a></td>
                            <td>${mod.categoria}</td>
                            <td>${mod.jogo}</td>
                            <td><a href="${mod.link}" target="_blank">[Download]</a></td>
                        </tr>
                    `;
                });
            }
        }

        fetchMods();
    </script>
</body>
</html>
